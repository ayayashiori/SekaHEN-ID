<!DOCTYPE html>
<html lang="id" manifest="cache.manifest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SekaHEN Exploit (っ˘ω˘ς)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

<style>
  * {
    box-sizing: border-box;
  }

  body {
    font-family: 'Quicksand', 'Poppins', sans-serif;
    background: linear-gradient(135deg, #f3e8ff 0%, #e9d5ff 50%, #d8b4fe 100%);
    color: #2d2640;
    min-height: 100vh;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px;
    overflow-x: hidden;
    user-select: none;
  }

  .glass-panel {
    background: rgba(255, 255, 255, 0.85);
    border: 2px solid rgba(255, 255, 255, 0.95);
    box-shadow: 0 20px 40px rgba(116, 90, 138, 0.2);
    border-radius: 36px;
    width: 100%;
    max-width: 750px;
    padding: 40px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .brand-header {
    display: flex;
    flex-direction: column;
    gap: 6px;
    border-bottom: 2px solid rgba(216, 180, 254, 0.3);
    padding-bottom: 16px;
    text-align: center;
  }

  h1 {
    font-size: 38px;
    font-weight: 700;
    color: #4c1d95;
    margin: 0;
  }

  .subtitle {
    font-size: 15px;
    color: #7c3aed;
    font-weight: 600;
    margin: 0;
  }

  .stack-container {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .chibi-floating-container {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 5px 0;
  }

  #chibi-img {
    width: 200px;
    height: 200px;
    object-fit: contain;
    filter: drop-shadow(0 10px 20px rgba(116, 90, 138, 0.25));
  }

  .glass-card {
    background: rgba(255, 255, 255, 0.9);
    border: 1px solid rgba(233, 213, 255, 0.8);
    border-radius: 24px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 8px 20px rgba(116, 90, 138, 0.08);
  }

  .status-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: #9333ea;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  #state {
    font-size: 20px;
    font-weight: 700;
    color: #2d2640;
    margin-bottom: 8px;
    line-height: 1.4;
  }

  /* Spinner */
  #spin {
    width: 40px;
    height: 40px;
    margin: 10px auto;
    border: 4px solid #e9d5ff;
    border-top-color: #9333ea;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  #msg {
    font-size: 16px;
    font-weight: 700;
    color: #e11d48;
    margin-top: 8px;
    display: none;
  }

  #wrap {
    padding: 0;
  }

  /* Sembunyikan spinner saat proses selesai atau gagal */
  body.done #spin,
  body.fail #spin {
    display: none;
  }

  body.fail #msg {
    display: block;
  }

  /* Mode log */
  body.log #spin,
  body.log #msg,
  body.log .chibi-floating-container {
    display: none;
  }

  body.log #state {
    display: block;
    font-size: 20px;
    color: #4c1d95;
  }

  body.log #out {
    display: block;
    white-space: pre-wrap;
    font: 12px/1.45 Consolas, monospace;
    background: #ffffff;
    border: 1px solid rgba(233, 213, 255, 0.8);
    border-radius: 12px;
    padding: 12px;
    height: 200px;
    overflow-y: auto;
    color: #2d2640;
    margin-top: 10px;
  }

  .footer-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: #7c3aed;
    padding-top: 12px;
    border-top: 2px solid rgba(216, 180, 254, 0.3);
    font-weight: 600;
    gap: 12px;
  }

  .ok {
    color: #059669 !important;
    font-weight: 700;
  }

  .bad {
    color: #e11d48 !important;
    font-weight: 700;
  }

  .warn {
    color: #d97706 !important;
    font-weight: 700;
  }

  /* Tampilan layar kecil */
  @media (max-width: 600px) {
    body {
      padding: 16px;
    }

    .glass-panel {
      padding: 24px 18px;
      border-radius: 28px;
    }

    h1 {
      font-size: 28px;
    }

    #chibi-img {
      width: 160px;
      height: 160px;
    }

    .glass-card {
      padding: 18px;
    }

    .footer-info {
      flex-direction: column;
      text-align: center;
    }
  }
</style>
</head>

<body class="safe">
  <div class="glass-panel">

    <div class="brand-header">
      <h1>SekaHEN Loader (っ˘ω˘ς)</h1>
      <p class="subtitle">Ayo Kita Mulai~</p>
    </div>

    <div class="stack-container">

      <div class="chibi-floating-container">
        <img
          id="chibi-img"
          src="chibi-loading.png"
          alt="Chibi Seka-chan"
        >
      </div>

      <div class="glass-card">
        <div>
          <div class="status-label">Seka-Chan Status</div>

          <div id="state">
            Seka-Chan Lagi nyari kelemahan sistem...
          </div>

          <!-- Elemen kontrol inti RAWGAME -->
          <div id="spin"></div>

          <div id="msg">
            Yah, Seka-chan gagal. Coba restart dan ke sini lagi, ya! TwT
          </div>

          <div id="wrap">
            <div id="out"></div>
          </div>
        </div>
      </div>

    </div>

    <div class="footer-info">
      <span>Forked Dari RAWGAME ♥ UI dari ayayashiori</span>
      <span>
        Psst! Aku Seka-chan! Orbis dan sekai sama-sama berarti dunia, lho! Sekarang ngerti, kan? ♥
      </span>
    </div>

  </div>

<script type="module">
  import "./jb.js?v=10";

  const chibiImg = document.getElementById("chibi-img");
  const stateEl = document.getElementById("state");

  // Pantau perubahan status dari skrip exploit.
  // Fitur ekspresi Seka-chan tetap aktif tanpa progress bar.
  const observer = new MutationObserver(() => {
    const bodyClass = document.body.className;

    if (bodyClass.includes("done")) {
      chibiImg.src = "chibi-success.png";
      stateEl.textContent = "Yes! Seka-Chan Bisa! ♥";
      stateEl.className = "ok";

    } else if (bodyClass.includes("fail")) {
      chibiImg.src = "chibi-failed.png";
      stateEl.textContent = "Seka-chan ga bisa nih... TwT";
      stateEl.className = "bad";
    }
  });

  observer.observe(document.body, {
    attributes: true,
    attributeFilter: ["class"]
  });
</script>

</body>
</html>
